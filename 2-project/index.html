<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Plastic Ocean Scroll</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <canvas id="oceanCanvas"></canvas>

        <!-- Year text overlay (replaces the old .year div) -->
        <div class="year-overlay" id="yearOverlay">
            <div class="year-text">2019</div>
        </div>

        <!-- Message text overlay (appears at bottom) -->
        <div class="message-overlay" id="messageOverlay">
            <div class="message-text">The ocean doesn't forget<br>about what we throw away.</div>
        </div>

        <div class="mass-counter" id="massLabel">0 tons</div>
        <!-- <div class="citation">Meijer et al. (2021) – with minor processing by Our World in Data</div> -->
        <div class="instruction">↓ scroll down</div>

        <div class="scroll-space" id="scrollSpacer"></div>

        <script src="script.js"></script>
    </body>
</html>
